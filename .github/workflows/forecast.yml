name: Refresh Sector Forecast (manual)

on:
  workflow_dispatch:
    inputs:
      with_analogs:
        description: 'Also refresh historical analogs (spends a few Twelve Data credits)'
        type: boolean
        default: false
      picks_dry_run:
        description: 'Dry-run the Pick of the Week for next week (prints candidates, writes nothing)'
        type: boolean
        default: false

# Shares one concurrency group with every other Twelve Data / engine job so
# overlapping runs queue instead of doubling the request rate.
concurrency:
  group: twelvedata
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r engine/requirements.txt

      - name: Refresh forecast
        working-directory: engine
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          WITH_ANALOGS: ${{ inputs.with_analogs && '1' || '0' }}
        run: python main_forecast.py

      - name: Pick of the Week dry run
        if: ${{ inputs.picks_dry_run }}
        working-directory: engine
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DRY_RUN: '1'
        run: python -c "import weekly_picks; weekly_picks.create_weekly_picks()"
