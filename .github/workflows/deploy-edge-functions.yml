name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

# Project ref isn't a secret -- it's already public inside web/config.js's
# SUPABASE_URL (https://<ref>.supabase.co), which every visitor's browser
# already receives.
env:
  PROJECT_REF: upnxvtwsscchftwmtapm

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy chat function
        working-directory: supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy chat --project-ref "$PROJECT_REF"

      - name: Deploy send-welcome-email function
        working-directory: supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy send-welcome-email --project-ref "$PROJECT_REF" --no-verify-jwt
